spring.application.name=RemoteCodeExecutionServer

mcp.url=http://127.0.0.1:4040/mcp
mcp.api-url=http://127.0.0.1:4040
mcp.token=MY_TOKEN
mcp.connect-timeout-seconds=10
mcp.read-timeout-seconds=300
mcp.execution-timeout-seconds=120
mcp.kernel-pool-min-size=1
mcp.kernel-pool-max-size=4
mcp.kernel-acquire-timeout-seconds=60

scripts.dir=scripts
